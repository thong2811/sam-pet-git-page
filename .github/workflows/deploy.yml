name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Thiết lập quyền hạn cho GITHUB_TOKEN để cho phép deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm install

      - name: Build ứng dụng bằng Vite
        run: npm run build

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact thư mục dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
